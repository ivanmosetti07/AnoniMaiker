# Versione Windows: prove e installatore su una macchina Windows vera.
# Parte a mano (Actions › Windows › Run workflow) o a ogni modifica di windows/. L'installatore resta fra gli artefatti
# della corsa: la release la pubblica Scripts/pubblica-windows.sh dopo averlo firmato sul Mac.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - name: Motore (dalla release motore-onnx-1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run motore
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Prove
        run: npm test
      - name: Installatore
        run: npm run dist
      - name: Prova dell'app installata (motore, cifratura, anonimizzazione)
        shell: pwsh
        env:
          ANONIMAIKER_DATI: ${{ runner.temp }}\dati-prova
          ANONIMAIKER_PROVA: ${{ github.workspace }}\windows\scripts\prova-app.json
        run: |
          $app = Start-Process -FilePath "dist\win-unpacked\AnoniMaiker.exe" -ArgumentList "--prova" -PassThru
          if (-not $app.WaitForExit(240000)) { $app.Kill(); throw "L'app non ha finito la prova in 4 minuti" }
          if (-not (Test-Path prova-risultato.json)) { throw "Nessun risultato dalla prova" }
          $r = Get-Content prova-risultato.json -Raw
          Write-Output $r
          $j = $r | ConvertFrom-Json
          if ($j.engine.kind -ne "ready") { throw "Motore non pronto" }
          if ($j.vault.kind -ne "ready") { throw "Dati non aperti" }
          if ($j.anonimizzato -notmatch "\[FULLNAME_1\]" -or $j.anonimizzato -match "Mario Rossi") { throw "Anonimizzazione sbagliata" }
          if ($j.riconvertito -notmatch "Mario Rossi") { throw "Riconversione sbagliata" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Prova-app
          path: |
            windows/prova-anonimizza.png
            windows/prova-risultato.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AnoniMaiker-Windows
          path: windows/dist/*.exe
          retention-days: 14
